<!DOCTYPE html>
<html>
<head>
<style>

  .container { display: flex; flex-direction: column; height: 300px; padding: 20px; background: #eee; }
  table { width: 100%; height: 100%; border-collapse: collapse; border: 2px solid red; }
  th, td { border: 2px solid red; }
</style>
</head>
<body>
  <div class="container">
    <h2>Notes</h2>
    <div style="flex: 1; min-height: 0;">
      <table>
        <thead>
          <tr><th>Sun</th><th>Mon</th></tr>
        </thead>
        <tbody>
          <tr><td>1</td><td>2</td></tr>
          <tr><td>3</td><td>4</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
